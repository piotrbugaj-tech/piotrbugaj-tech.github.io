# EstateHDR - jedyny plik konfiguracyjny.
# Sekcje odpowiadają etapom pipeline'u. Presety (na dole) nadpisują wybrane wartości.
# Każdą wartość można też nadpisać z CLI: --set tonemap.target_key=0.25

preset: neutral

runtime:
  workers: auto            # liczba równoległych serii: auto = wg CPU i pamięci
  memory_limit_gb: auto    # budżet RAM dla całego batcha (auto = 75% dostępnej)
  device: auto             # auto | cpu | gpu: GPU przez OpenCL (OpenCV T-API) dla remapu, warpów i filtrów; bez OpenCL -> CPU
  opencv_threads: auto
  analysis_max_side: 1600  # rozdzielczość analizy (maski, transformacje, tone mapping bazowy)

input:
  recursive: true
  crf: auto                # auto | srgb  (linearyzacja JPEG: dopasowanie krzywej aparatu do serii)
  raw:
    highlight_mode: clip   # clip | blend | ignore (LibRaw)
    use_camera_wb: true
    demosaic: dht          # dht | ahd | aahd | vng | linear
    fbdd_single: true      # redukcja szumu FBDD przed demozaikowaniem dla pojedynczych klatek RAW

grouping:
  mode: auto               # auto | fixed | single
  bracket_size: 0          # 0 = automatycznie; >1 = stała liczba klatek w serii
  max_gap_s: 6.0           # przerwa czasowa (EXIF) rozpoczynająca nową serię
  min_similarity: 0.35     # podobieństwo treści (korelacja rang gradientów)
  ev_tolerance: 0.2
  focal_tolerance: 0.05
  noexif_min_ev_step: 0.4      # bez EXIF: minimalna różnica jasności między klatkami bracketu
  noexif_min_similarity: 0.6   # bez EXIF: minimalne podobieństwo treści klatek bracketu

align:
  enabled: true
  # model ruchu: translation | similarity | affine | homography | auto.
  # auto: model afiniczny, a perspektywa (homografia) tylko dla klatki, w której dane ją potwierdzają:
  # gęste dopasowania ECC afiniczne i homograficzne są porównywane na niezależnych dopasowaniach SIFT
  # (log. iloraz wiarygodności > auto_llr, czyli > 20:1) i modele różnią się w rogu o > auto_min_px
  # (pełna rozdzielczość). Sama homografia z ECC bywa fałszywa (przepalenia, szum, ruchome obiekty);
  # perspektywa jest globalna, ruchomy obiekt lokalny: dowód liczony też w siatce auto_grid x auto_grid
  # pól kadru - pola, w których dopasowania przesuwają się wzdłuż różnicy modeli dużo bardziej niż
  # w reszcie kadru (ruchomy obiekt, za którym homografia częściowo podąża), są pomijane, a reszta
  # dowodu musi przekraczać auto_llr także bez najkorzystniejszego pola
  # (raport: align[].model_select: llr_rest, local_cells, cell_llr, cell_beta);
  # oba etapy ECC liczą się w modelu wybranym dla klatki (raport: align[].model)
  model: auto
  auto_llr: 3.0
  auto_min_px: 0.5
  auto_grid: 3
  features: 4000
  ecc: true
  fine_ecc: true
  fine_max_side: 2600
  max_shift_frac: 0.08
  still_px: 0.25

deghost:
  enabled: true
  threshold_ev: 0.45
  noise_k: 0.035
  min_area_frac: 0.0004

merge:
  strip_rows: 1024
  black_bias_max: 0.05     # neutralizacja kolorowego przesunięcia czerni (fioletowe cienie RAW)
  sat_lo: 0.82
  sat_hi: 0.97

windows:
  enabled: true
  # obszar "poza zakresem wnętrza": luminancja > over_ev powyżej poziomu ścian wnętrza
  over_ev: 2.5
  min_area_frac: 0.0015
  exterior_target: 0.595   # docelowa jasność widoku za oknem (display, 0-1)
  strength: 1.0            # 0 = brak pulla, 1 = pełny
  feather_px: 2.0          # miękkość przejścia na ramach (przy analizie)
  lamp_max_area_frac: 0.004
  sun_patch_target: 0.84   # plamy słońca: zachowaj teksturę (wartość sRGB mediany)
  window_min_area_frac: 0.005
  window_score_min: 0.5

white_balance:
  enabled: true
  global_strength: 0.5     # 0..1 udział korekty globalnej (kalibracja, D-32)
  target_cct: 7400         # cel korekty globalnej (K); przy global_strength 0.5 biel ląduje w połowie drogi
  max_global_shift: 0.45
  mixed_light_strength: 1.0
  max_local_shift: 1.375   # max lokalna zmiana chromatyczności (log); żarówka 2700 K vs dzień wymaga ~1.2
  grid: 64
  field_smooth: 0.015
  # pewność lokalnej estymaty = wygładzona ufność komórek / typowa (p75): od support_hi pełna korekta
  # lokalna, poniżej support_lo żadna (wcześniej korekta rosła liniowo z ufnością, a przy lampach
  # ufność jest niższa, więc zostawała połowa dominanty: ΔE strefy żarówek 8-9)
  support_lo: 0.15
  support_hi: 0.6
  fill_smooth: 0.15        # gdzie lokalnych danych mało (akcent, faktura): światło regionu (σ = ułamek siatki), 0 = sama korekta globalna
  local_lo_percentile: 10
  max_locus_dist: 0.35
  tint_strength: 1.0

geometry:
  enabled: true
  verticals: true
  vertical_strength: 1.0
  max_pitch_deg: 12.0
  max_roll_deg: 6.0
  min_lines: 6
  distortion: auto         # auto | off
  max_k1: 0.18
  min_k1: 0.03             # mniejsze |k1| mieści się w błędzie estymacji - nie korygujemy
  min_chains: 12           # min. liczba prostych krawędzi do estymacji dystorsji (zbliżenia mebli, tkanin: brak korekty)
  crop: true
  max_crop: 0.15           # jeśli kadr byłby większy, korekcja pionów jest osłabiana
  default_focal_35mm: 24
  resize_back: true        # wynik "full" w wymiarach wejścia (jak AutoHDR)

lens:
  # winieta: auto | off | ułamek spadku jasności w rogu (np. 0.3 = rogi o 30% ciemniejsze, model 1 - v r^2).
  # auto (symetria gradientów radialnych) koryguje tylko przy wiarygodnym dowodzie: wnętrza same z siebie
  # ciemnieją ku brzegom kadru (światło okien/lamp blisko środka), więc na typowych scenach auto nic nie robi
  # (powód i oszacowanie w raporcie: lens.vignetting). Znana winieta obiektywu: wpisz ją ręcznie.
  vignetting: auto
  vignetting_max: 0.5      # auto: maksymalny korygowany spadek jasności w rogu
  ca: auto                 # auto | off

tonemap:
  key_percentile: 50
  black_percentile: 0.5    # percentyl wnętrza mapowany na black_target
  white_percentile: 99.0   # percentyl wnętrza mapowany na target_white (okna/lampy wyłączone)
  black_target: 0.03       # wartości sRGB (0-1) na wyjściu
  max_toe_expansion: 4.0   # max rozciągnięcie kontrastu od czerni do klucza względem sceny (exteriory: szyby nie toną w czerni)
  target_key: 0.70         # jasność średnich tonów (sRGB); kalibracja do jasnych ścian (SPEC: L* 78-88)
  target_white: 0.96
  shoulder_ev: 2.5         # miękkie ramię powyżej bieli wnętrza
  highlight_knee: 0.88     # start łagodnego wyciszania saturacji w światłach
  toe_ev: 2.0
  compress_shadows: 0.64   # lokalna kompresja bazy (1 = brak, mniej = mocniej podniesione cienie)
  compress_highlights: 0.64
  base_radius_frac: 0.025
  base_radius_frac2: 0.08
  base_eps: 0.08
  base_mix: 0.5
  detail: 1.1
  saturation_preserve: 0.9
  guided_upsample: true
  upsample_eps: 0.02
  contrast: 0.06
  vibrance: 0.1
  saturation: 1.03

denoise:
  enabled: true
  luma: 0.6                # siła odszumiania luminancji (0-1+)
  chroma: 1.0
  strong_sigma: 0.015      # tryb silny (NLM po stabilizacji wariancji), gdy szum całego obrazu jest większy...
  strong_dark_sigma: 0.06  # ...albo szum cieni
  strong_dark_sigma_raw: 0.02  # pojedyncza klatka RAW: podniesione cienie
  strong_sigma_developed: 0.02 # gotowe JPEG-i: szum mierzony na najgładszych blokach w każdym paśmie jasności (podniesione
                               # cienie obok czystych ścian), bez części, którą tłumaczy faktura (faktura to nie szum, D-49)
single_image:
  denoise_boost: 1.6       # tryb pojedynczego zdjęcia: mocniejsze odszumianie
  # pojedynczy, już wywołany plik (JPEG): fotograf ustalił ekspozycję i balans bieli -
  # klucz tonalny bierzemy z obrazu (w granicach), a WB działa słabiej
  key_from_input: true
  key_range: [-0.25, 0.10] # dopuszczalne odchylenie klucza od tonemap.target_key (gotowe JPEG-i: bez rozjaśniania,
                           # ciemne, nastrojowe ujęcia rozjaśniane najwyżej do 0.45; D-49)
  white_range: [-0.12, 0.0] # biel gotowego zdjęcia zostaje (najwyżej tonemap.target_white, najniżej o 0.12 mniej; D-49)
  wb_strength: 0.8         # mnożnik siły globalnego WB ...
  wb_target_cct: neutral   # ... względem neutralnej bieli autora (R=G=B; D-49: neutralne zostaje neutralne, dominanta znika
                           # w ~40%); liczba = cel w K jak white_balance.target_cct (6500 K nie jest neutralne: R/G 0.96)
  wb_mixed_light: 0.2      # mnożnik lokalnej korekty mieszanego światła (na zbliżeniach brała kolor tkanin za światło); nocą × night.wb_strength
  noise_floor_code: 1.0    # próg szumu tone mappingu gotowego JPEG-a: co najmniej tyle kodów 8-bit (czysta czerń nie staje się outlierem -20 EV)
  compress_shadows_min: 0.8
  distortion: off          # gotowe JPEG-i są zwykle już skorygowane w edytorze: bez auto-dystorsji (piony zostają)
  # pojedynczy RAW: im głośniejsze cienie (szum / mediana sygnału, pełna rozdzielczość), tym słabiej
  # podnoszone cienie i niższy klucz - szumu z jednej klatki nie da się usunąć (D-39)
  noise_nsr: [0.03, 0.06, 0.15]
  noise_compress_shadows: [0.9, 0.95]
  noise_key_drop: [0.10, 0.15]

night:                     # nocne exteriory: ciemne, gładkie niebo u góry kadru (z radiancji po merge)
  enabled: true
  max_top_luma: 0.05       # mediana górnych 25% kadru, gdy źródła światła (p99.5) = biel
  max_top_ratio: 0.6       # ... względem mediany całego kadru
  max_top_texture: 0.15    # ... i gładkość log-luminancji (niebo, a nie ciemny sufit z detalami)
  target_key: 0.32         # niski klucz: noc zostaje nocą
  compress_shadows: 0.9
  wb_strength: 0.5         # sztuczne światło nocą jest z natury kolorowe

sharpen:
  enabled: true
  amount: 0.35
  radius_px: 1.0           # dla pełnej rozdzielczości; dla mniejszych rozmiarów skalowane
  threshold: 0.01

modules:
  sky:
    enabled: false
    style: clear           # clear | wispy | dramatic | <ścieżka do pliku/katalogu nieba>
    interior_windows: false # wymiana nieba także w widokach okien wnętrz
  twilight:
    enabled: false
    style: pink            # blue | pink | golden
    darken_ev: 2.0         # przyciemnienie pierwszego planu
    window_glow: 1.0       # siła świecenia okien
  remove:
    enabled: false         # wymaga maski <nazwa>.mask.png albo maski z UI
    method: auto           # auto | patch | telea
    dilate_frac: 0.002     # poszerzenie maski (ułamek dłuższego boku)
    patch: 9
    max_work_side: 320     # rozdzielczość robocza wyszukiwania łatek (pełna rozdz. przez pole przesunięć)
  grass:
    enabled: false
    target_hue: 95         # docelowy odcień trawy (stopnie HSV)
    hue_pull: 0.6
    saturation_boost: 0.25

export:
  sizes:
    - {name: full, long_edge: 0, quality: 95, sharpen: 1.0}
    - {name: mls, long_edge: 2048, quality: 90, sharpen: 0.8}
  subsampling: "4:4:4"
  icc: srgb                # srgb (osadzony profil sRGB, ICC v2) | none
  exif: copy               # copy | minimal | none
  tiff16: false            # dodatkowo 16-bit TIFF w pełnej rozdzielczości
  name_template: "{name}_{size}"
  save_previews: true      # małe podglądy przed/po dla UI

presets:
  neutral:
    label: "Neutralny - naturalny wygląd do ogłoszeń (MLS)"
    overrides: {}
  airy:
    label: "Jasny (airy) - więcej światła i lekkości"
    overrides:
      tonemap:
        target_key: 0.85
        target_white: 0.97
        black_target: 0.05
        compress_shadows: 0.78
        compress_highlights: 0.59
        contrast: -0.02
        vibrance: 0.05
        saturation: 0.98
      windows:
        exterior_target: 0.655
  premium:
    label: "Premium - więcej kontrastu i koloru, głębszy widok za oknami"
    overrides:
      tonemap:
        target_key: 0.70
        target_white: 0.96
        black_target: 0.02
        compress_shadows: 0.86
        compress_highlights: 0.57
        detail: 1.2
        contrast: 0.12
        vibrance: 0.18
        saturation: 1.05
      windows:
        exterior_target: 0.495
        strength: 1.0
